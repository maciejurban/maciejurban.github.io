name: Deploy to GitHub Pages

# Manual only, on purpose.
#
# The 2021 portfolio is the site currently served at maciejurban.github.io, from
# the `master` branch. This rework lives on `main` and must not publish over it
# by accident, so there is no push trigger: deploying is an explicit action.
#
# To publish this site:
#   1. gh workflow run deploy.yml --ref main
#   2. switch Pages to the Actions build (Settings → Pages → Build: GitHub Actions)
# To go back to the 2021 site: switch Pages back to "Deploy from a branch" → master.
on:
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Astro site
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Custom domain (not set up yet — see DESIGN-NOTES/README):
# When a domain is ready, add `public/CNAME` containing the bare hostname
# (e.g. `maciejurban.com`), set `site` in astro.config.mjs to that origin, and
# configure the DNS records in the domain registrar. `public/.nojekyll` and the
# rest of this workflow stay exactly as they are.
